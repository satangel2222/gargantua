<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GARGANTUA · RELATIVISTIC SINGULARITY</title>
<meta name="description" content="A single-file WebGL2 General-Relativistic black hole: RK4 null-geodesic raytracing, 4.19M-particle accretion, 8-level Kawase bloom." />
<meta name="theme-color" content="#000000" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23000' stroke='%23fff' stroke-width='1.2'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='2.4' fill='none' stroke='%23f7b26a' stroke-width='1.6'/%3E%3C/svg%3E" />
<meta property="og:title" content="GARGANTUA · RELATIVISTIC SINGULARITY" />
<meta property="og:description" content="RK4 null-geodesic raytracer · 4,194,304 particle accretion · 8-level Kawase bloom. One HTML file. No assets." />
<style>
/*__CSS__*/
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div id="hud">
  <div class="pill">
    <b id="hFps">--</b><span>FPS</span>
    <i class="sep"></i><b id="hMs">--</b><span>MS</span>
    <i class="sep"></i><span class="tag" id="hPart">4.19M PARTICLES</span>
    <i class="sep"></i><span class="tag hideSm" id="hSteps">RK4: 360 STEPS</span>
    <i class="sep"></i><span class="tag hideSm" id="hSsaa">2.0x SSAA</span>
    <i class="sep"></i>
    <div class="seg" id="hSsaaSeg">
      <button data-v="1">1x</button><button data-v="2" class="on">2x</button><button data-v="4">4x</button>
    </div>
    <i class="sep"></i>
    <button class="ghost" id="hSafe">SAFE MODE</button>
    <i class="sep"></i>
    <button class="ghost" id="hCtrl">CONTROLS</button>
  </div>

  <div id="panel">
    <div class="row">
      <label>Kerr Spin <span id="sSpinOut">0.34</span></label>
      <input id="sSpin" type="range" min="0" max="1" step="0.01" value="0.34" />
    </div>
    <div class="row">
      <label>Disk Turbulence <span id="sTurbOut">0.62</span></label>
      <input id="sTurb" type="range" min="0" max="1" step="0.01" value="0.62" />
    </div>
    <div class="row">
      <label>Doppler Intensity <span id="sDoppOut">1.00</span></label>
      <input id="sDopp" type="range" min="0" max="2" step="0.01" value="1" />
    </div>
    <div class="row">
      <label>Camera Orbit <span id="sOrbitOut">0.35</span></label>
      <input id="sOrbit" type="range" min="0" max="2" step="0.01" value="0.35" />
    </div>
    <div class="row">
      <label>Exposure <span id="sExpOut">1.18</span></label>
      <input id="sExp" type="range" min="0.2" max="3" step="0.01" value="1.18" />
    </div>
  </div>
</div>

<div id="sig">GARGANTUA · RELATIVISTIC SINGULARITY</div>
<div id="hint">DRAG TO ORBIT · SCROLL TO DOLLY</div>
<div id="toast"></div>

<div id="boot">
  <div id="bootTitle">GARGANTUA</div>
  <div id="bootSub">RELATIVISTIC SINGULARITY</div>
  <div id="bootBar"><i></i></div>
  <div id="bootLabel">INITIALIZING</div>
</div>

<script type="module">
/*__BUILD__*/
</script>
</body>
</html>
